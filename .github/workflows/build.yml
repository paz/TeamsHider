name: Build and Release

on:
  push:
    tags:
    - 'v*'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run tests
      run: |
        dotnet test TeamsHider.Tests/TeamsHider.Tests.csproj \
          --configuration Release \
          --logger "trx;LogFileName=test-results.trx"

  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Cache NuGet packages for faster restores
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-release-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-release-
          ${{ runner.os }}-nuget-

    # Install Windows App SDK workload for MRT Core build tasks
    - name: Install Windows App SDK build tools
      run: |
        $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $vsInstaller modify `
          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
          --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
          --quiet --norestart --wait
      shell: pwsh
      continue-on-error: true

    - name: Restore WinUI 3 dependencies
      run: dotnet restore TeamsHider.WinUI3/TeamsHider.WinUI3.csproj

    # WinUI 3 - Self-contained (includes .NET runtime, larger but no dependencies)
    - name: Build WinUI 3 (Self-contained)
      run: |
        msbuild TeamsHider.WinUI3/TeamsHider.WinUI3.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:RuntimeIdentifier=win-x64 `
          /p:SelfContained=true `
          /p:PublishDir=..\publish-winui3-selfcontained\ `
          /t:Publish `
          /m

    # WinUI 3 - Framework-dependent (smaller, requires .NET 10 Desktop Runtime)
    - name: Build WinUI 3 (Framework-dependent)
      run: |
        msbuild TeamsHider.WinUI3/TeamsHider.WinUI3.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:RuntimeIdentifier=win-x64 `
          /p:SelfContained=false `
          /p:PublishDir=..\publish-winui3-portable\ `
          /t:Publish `
          /m

    # Legacy - Self-contained
    - name: Build Legacy (Self-contained)
      run: |
        dotnet publish TeamsHider/TeamsHider.csproj `
          --configuration Release `
          --self-contained true `
          -r win-x64 `
          -o ./publish-legacy-selfcontained

    # Legacy - Framework-dependent
    - name: Build Legacy (Framework-dependent)
      run: |
        dotnet publish TeamsHider/TeamsHider.csproj `
          --configuration Release `
          --self-contained false `
          -r win-x64 `
          -o ./publish-legacy-portable

    - name: Get build sizes
      id: sizes
      run: |
        $winui3sc = (Get-ChildItem -Path ./publish-winui3-selfcontained -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        $winui3p = (Get-ChildItem -Path ./publish-winui3-portable -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        $legacysc = (Get-ChildItem -Path ./publish-legacy-selfcontained -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        $legacyp = (Get-ChildItem -Path ./publish-legacy-portable -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        echo "winui3_sc=$([math]::Round($winui3sc))MB" >> $env:GITHUB_OUTPUT
        echo "winui3_p=$([math]::Round($winui3p))MB" >> $env:GITHUB_OUTPUT
        echo "legacy_sc=$([math]::Round($legacysc))MB" >> $env:GITHUB_OUTPUT
        echo "legacy_p=$([math]::Round($legacyp))MB" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create Release ZIPs
      run: |
        Compress-Archive -Path ./publish-winui3-selfcontained/* -DestinationPath ./TeamsHider-WinUI3-SelfContained.zip
        Compress-Archive -Path ./publish-winui3-portable/* -DestinationPath ./TeamsHider-WinUI3-Portable.zip
        Compress-Archive -Path ./publish-legacy-selfcontained/* -DestinationPath ./TeamsHider-Legacy-SelfContained.zip
        Compress-Archive -Path ./publish-legacy-portable/* -DestinationPath ./TeamsHider-Legacy-Portable.zip

    - name: Create GitHub Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "TeamsHider-WinUI3-SelfContained.zip,TeamsHider-WinUI3-Portable.zip,TeamsHider-Legacy-SelfContained.zip,TeamsHider-Legacy-Portable.zip"
        body: |
          ## TeamsHider Release

          ### Downloads

          #### WinUI 3 (Recommended - Modern UI with built-in settings)
          | File | Size | Requirements |
          |------|------|--------------|
          | **TeamsHider-WinUI3-SelfContained.zip** | ~${{ steps.sizes.outputs.winui3_sc }} | None (includes .NET runtime) |
          | **TeamsHider-WinUI3-Portable.zip** | ~${{ steps.sizes.outputs.winui3_p }} | [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |

          #### Legacy (Windows Forms)
          | File | Size | Requirements |
          |------|------|--------------|
          | **TeamsHider-Legacy-SelfContained.zip** | ~${{ steps.sizes.outputs.legacy_sc }} | None (includes .NET runtime) |
          | **TeamsHider-Legacy-Portable.zip** | ~${{ steps.sizes.outputs.legacy_p }} | [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) |

          ### Which version should I download?
          - **First time user?** Download `TeamsHider-WinUI3-SelfContained.zip` - works out of the box
          - **Have .NET 10 installed?** Download `TeamsHider-WinUI3-Portable.zip` - smaller download
          - **Need legacy version?** Use the Legacy variants

          ### What's New
          See CHANGELOG in README.md for details.
        generateReleaseNotes: true
