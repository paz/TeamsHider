name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run tests with coverage
      run: |
        dotnet test TeamsHider.Tests/TeamsHider.Tests.csproj \
          --configuration Release \
          --logger "trx;LogFileName=test-results.trx" \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: TestResults/

  build-legacy:
    name: Build Legacy (WinForms)
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Build Legacy Version
      run: |
        dotnet publish TeamsHider/TeamsHider.csproj `
          --configuration Release `
          --self-contained true `
          -r win-x64 `
          -o ./publish-legacy

    - name: Upload Legacy Build
      uses: actions/upload-artifact@v4
      with:
        name: TeamsHider-Legacy
        path: ./publish-legacy/

  build-winui3:
    name: Build WinUI 3
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # Cache NuGet packages for faster restores
    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-winui3-${{ hashFiles('TeamsHider.WinUI3/TeamsHider.WinUI3.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-winui3-

    # Install Windows App SDK workload for MRT Core build tasks
    # windows-latest image may already have these, but ensure they're present
    - name: Install Windows App SDK build tools
      run: |
        $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $vsInstaller modify `
          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
          --add Microsoft.VisualStudio.ComponentGroup.UWP.Support `
          --quiet --norestart --wait
      shell: pwsh
      continue-on-error: true

    - name: Restore dependencies
      run: dotnet restore TeamsHider.WinUI3/TeamsHider.WinUI3.csproj

    - name: Build WinUI 3 Version
      run: |
        msbuild TeamsHider.WinUI3/TeamsHider.WinUI3.csproj `
          /p:Configuration=Release `
          /p:Platform=x64 `
          /p:RuntimeIdentifier=win-x64 `
          /p:SelfContained=true `
          /p:PublishDir=..\publish-winui3\ `
          /t:Publish `
          /m

    - name: Upload WinUI 3 Build
      uses: actions/upload-artifact@v4
      with:
        name: TeamsHider-WinUI3
        path: ./publish-winui3/
